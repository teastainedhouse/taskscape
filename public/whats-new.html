<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>What's New? - Taskscape</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/theme-toolbar.css">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
</head>
<body>
  <div id="dev-banner"></div>
  <div class="wrap">
    <header class="site-header">
      <p class="site-title"><a href="index.html" data-site-title>Taskscape</a></p>
      <nav aria-label="Main">
        <a href="index.html">Projects</a> |
        <a href="mine.html">My tasks</a> |
        <a href="whats-new.html">What's New?</a> |
        <a href="trash.html">Trash</a> |
        <a href="profile.html">Profile</a>
      </nav>
      <button type="button" id="sign-out" class="sign-out" hidden>Sign out</button>
      <a href="profile.html" class="avatar" id="avatar" aria-label="Your profile"></a>
    </header>

    <p id="status" class="status" role="status" aria-live="polite"></p>

    <main class="panel">
      <h1>What's New?</h1>
      <p class="muted">Every change, newest first. Entries about private items show only to their owner. "For you" shows other people's changes to the projects and tasks you own.</p>
      <div class="filters" role="group" aria-label="Filter activity">
        <div class="field">
          <label for="f-for">Show</label>
          <select id="f-for" name="for">
            <option value="">Everything</option>
            <option value="me">For you</option>
          </select>
        </div>
        <div class="field">
          <label for="f-via">Via</label>
          <select id="f-via" name="via">
            <option value="">Anyone</option>
            <option value="ui">UI (browser)</option>
            <option value="mcp">Claude (MCP)</option>
          </select>
        </div>
      </div>
      <div class="table-wrap">
        <table id="feed">
          <caption class="visually-hidden">Activity log</caption>
          <thead>
            <tr><th scope="col">When</th><th scope="col">Who</th><th scope="col">Via</th><th scope="col">What changed</th><th scope="col">Item</th></tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
      <p id="feed-empty" hidden>Nothing yet.</p>
      <p><button type="button" id="load-more" hidden>Load more</button></p>
    </main>

    <footer class="site-footer">
      <address data-served-by>Taskscape</address>
    </footer>
  </div>
  <script type="module" src="js/whats-new.js"></script>
</body>
</html>
