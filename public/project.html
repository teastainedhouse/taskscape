<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Project - Taskscape</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/theme-toolbar.css">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
</head>
<body>
  <div id="dev-banner"></div>
  <div class="wrap">
    <header class="site-header">
      <p class="site-title"><a href="index.html" data-site-title>Taskscape</a></p>
      <nav aria-label="Main">
        <a href="index.html">Projects</a> |
        <a href="mine.html">My tasks</a> |
        <a href="whats-new.html">What's New?</a> |
        <a href="trash.html">Trash</a> |
        <a href="tokens.html">My tokens</a>
      </nav>
      <span id="whoami" class="muted"></span>
      <button type="button" id="sign-out" class="sign-out" hidden>Sign out</button>
    </header>

    <div id="marquee" hidden></div>
    <p id="status" class="status" role="status" aria-live="polite"></p>

    <main class="panel">
      <p><a href="index.html">&laquo; All projects</a></p>
      <section id="project" aria-live="polite">
        <h1 id="project-name">Loading&hellip;</h1>
      </section>

      <section id="tasks-section" aria-labelledby="tasks-h" hidden>
        <h2 id="tasks-h">Tasks</h2>
        <p id="overdue-line" class="overdue-line" hidden></p>
        <div class="filters" id="task-filters" role="group" aria-label="Filter tasks"></div>
        <div class="table-wrap">
          <table id="tasks">
            <caption class="visually-hidden">Tasks in this project. Column headers sort the list.</caption>
            <thead></thead>
            <tbody></tbody>
          </table>
        </div>
        <p id="tasks-empty" hidden>No tasks match these filters.</p>
        <div id="under-construction" class="under-construction" hidden>
          <p>This project has no tasks yet.</p>
          <img src="img/under-construction.svg" alt="" width="320" height="120">
        </div>

        <form id="new-task" data-needs-edit>
          <h3>Add a task</h3>
          <div class="field"><label for="nt-title">Title</label><input type="text" id="nt-title" name="title" required maxlength="500" size="40"></div>
          <div class="field"><label for="nt-status">Status</label><select id="nt-status" name="status"></select></div>
          <div class="field"><label for="nt-owner">Owner</label><select id="nt-owner" name="owner"></select></div>
          <div class="field"><label for="nt-due">Due date</label><input type="date" id="nt-due" name="due_date"></div>
          <div class="field"><label for="nt-notes">Notes</label><textarea id="nt-notes" name="notes" rows="2"></textarea></div>
          <div class="field"><label><input type="checkbox" id="nt-private" name="private"> Private (only you can see it)</label></div>
          <button type="submit">Add task</button>
        </form>
      </section>
    </main>

    <footer class="site-footer">
      <address data-served-by>Taskscape</address>
      <div id="webring"></div>
    </footer>
  </div>
  <script type="module" src="js/tasks.js"></script>
</body>
</html>
